<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Блог сайта</title>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
</head>
<body>

<header th:insert="blocks/header.html :: header"></header>

<div class="container mt-5 mb-5">
  <h1>Добавление продукта</h1>
  <form action="/add-product" method="post">
    <text> Введите название и калорийность на 100г/мл</text>
    <input type="text" name="title" placeholder="Название продукта:" class="form-control">
    <input type="text" name="Kcal" placeholder="Калорийность" class="form-control"><br>
    <textarea name="Commentary" placeholder="Комментарии к продукту(особенности, разность калорийности и т.д.)"
              class="form-control"></textarea><br>
    <button type="submit" class="btn btn-success">Добавить продукт в список</button>
  </form>
</div>


</body>
</html>
