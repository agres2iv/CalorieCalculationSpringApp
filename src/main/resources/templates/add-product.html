<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Блог сайта</title>
    <meta content="text/html; charset=UTF-8" http-equiv="Content-Type"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>

<header th:insert="blocks/header.html :: header"></header>
<!--4Добавить жиры белки углеводы></Добавить-->
<div class="container mt-5 mb-5">
    <h1>Добавление продукта</h1>
    <form action="/add-product" method="post">
        <text> Введите название и калорийность на 100г/мл</text>
        <input class="form-control" name="title" placeholder="Название продукта:" type="text">
        <input class="form-control" name="protein" placeholder="Белки" type="text">
        <input class="form-control" name="fat" placeholder="Жиры" type="text">
        <input class="form-control" name="carbs" placeholder="Углеводы" type="text">
        <input class="form-control" name="fibers" placeholder="Клетчатка" type="text">
        <textarea class="form-control" name="Commentary"
                  placeholder="Комментарии к продукту(особенности, разность калорийности и т.д.)"></textarea>
        <button class="btn btn-success" type="submit">Добавить продукт в список</button>
    </form>
</div>


</body>
</html>
