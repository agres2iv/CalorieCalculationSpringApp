<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Изменение продукта</title>
    <meta content="text/html; charset=UTF-8" http-equiv="Content-Type"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>

<header th:insert="blocks/header.html :: header"></header>


<div class="container mt-5 mb-5">
    <h1>Изменение продукта</h1>
    <div th:each="el : ${productD}">

        <form method="post">
            <text> Введите название и калорийность на 100г/мл</text>
            <input class="form-control" name="title" placeholder="Название продукта:" th:value="${el.productName}"
                   type="text">
            <input class="form-control" name="Kcal" placeholder="Калорийность" th:value="${el.getKcal()}" type="number"><br>
            <textarea class="form-control" name="Commentary"
                      placeholder="Комментарии к продукту(особенности, разность калорийности и т.д.)"
                      th:text="${el.productCommentary}"/><br>
            <button class="btn btn-success" type="submit">Обновить</button>
        </form>
    </div>
</div>
</body>
</html>
