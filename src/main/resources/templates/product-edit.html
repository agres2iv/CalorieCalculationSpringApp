<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Изменение продукта</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
</head>
<body>

<header th:insert="blocks/header.html :: header"></header>


<div class="container mt-5 mb-5">
    <h1>Изменение продукта</h1>
    <div th:each="el : ${productD}">

    <form method="post">
        <text> Введите название и калорийность на 100г/мл</text>
        <input type="text" th:value="${el.productName}" name="title" placeholder="Название продукта:" class="form-control">
        <input type="number" th:value="${el.getKcal()}" name="Kcal" placeholder="Калорийность" class="form-control"><br>
        <textarea name="Commentary" placeholder="Комментарии к продукту(особенности, разность калорийности и т.д.)"
                  class="form-control" th:text="${el.productCommentary}"/><br>
        <button type="submit" class="btn btn-success">Обновить</button>
    </form>
    </div>
</div>
</body>
</html>
