<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title th:text="${Подробнее}"/>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
</head>
<header th:insert="blocks/header.html :: header"></header>
<body>
<div th:each="el : ${productD}" class = "alert alert-info mt-2">
    <h1 th:text="${el.getProductName()}"/>
    <h3 th:text="${el.getProductCommentary()}"/>
    <a th:href="@{/journal/{id}/edit(id=${el.id})}" class="btn btn-warning">Редактировать</a>
    <form th:action="@{/journal/{id}/remove(id=${el.id})}" method="post">
        <button class="btn btn-danger" type="submit">Удалить</button>
    </form>
</div>
</body>
</html>
