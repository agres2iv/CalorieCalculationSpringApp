<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title th:text="${Журнал}"/>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
</head>
<body>
<div th:each="el : ${productMain}" class = "alert alert-info mt-2">
  <h3 th:text="${el.getProductName()}"/>
  <h3 th:text="${el.getProductCommentary()}"/>
    <a th:href="@{/journal/{id}(id=${el.id})}" class="btn btn-warning">Детальнее</a>

</div>
<header th:insert="blocks/header.html :: header"></header>
<a class="p-2 text-dark" href="journal/product-add">Добавить продукт в список</a>
<p th:text="|Привет пузач, ${second}!|"/>
</body>
</html>
